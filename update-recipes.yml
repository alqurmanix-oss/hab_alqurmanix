name: Update recipes data
on:
  schedule:
    - cron: "0 */3 * * *"      # كل 3 ساعات
  workflow_dispatch:            # تشغيل يدوي من تبويب Actions
  push:
    paths: ["scripts/build_recipes.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_recipes.py
      - name: Commit if changed
        run: |
          git config user.name "aqx-bot"
          git config user.email "bot@alqurmanix.com"
          git add recipes-data.json
          git diff --staged --quiet || (git commit -m "chore: update recipes data" && git push)
